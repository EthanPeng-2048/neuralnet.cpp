# .github/workflows/cmake-single-platform.yml
name: CMake (Clang Latest, C++26)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  BUILD_TYPE: Release

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-26.04, windows-latest]
        include:
          - os: ubuntu-26.04
            artifact-name: linux-binaries
            binary-suffix: ""
            archive-name: neuralnet-linux-x64.7z
          - os: windows-latest
            artifact-name: windows-binaries
            binary-suffix: ".exe"
            archive-name: neuralnet-windows-x64.7z

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    # ========== 缓存：ccache（Linux） ==========
    - name: Cache ccache (Linux)
      if: runner.os == 'Linux'
      uses: actions/cache@v4
      with:
        path: ~/.cache/ccache
        key: ${{ runner.os }}-ccache-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-ccache-

    # ========== 缓存：ccache（Windows） ==========
    - name: Cache ccache (Windows)
      if: runner.os == 'Windows'
      uses: actions/cache@v4
      with:
        path: C:\Users\runneradmin\AppData\Local\ccache
        key: ${{ runner.os }}-ccache-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-ccache-

    # ========== 缓存：CMake 构建目录（配合 ccache 加速增量构建） ==========
    - name: Cache CMake build directory
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/build
        key: ${{ runner.os }}-cmake-build-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-cmake-build-

    # ========== Linux: 安装 LLVM Clang + Ninja ==========
    - name: Install Clang & Ninja (Linux)
      if: runner.os == 'Linux'
      run: |
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh all
        sudo ln -sf $(ls /usr/bin/clang-[0-9]* | sort -V | tail -n1) /usr/bin/clang
        sudo ln -sf $(ls /usr/bin/clang++-[0-9]* | sort -V | tail -n1) /usr/bin/clang++
        # libc++（LLVM 标准库）：对 C++26 range 迭代器的处理比默认 libstdc++ 更标准
        # ccache：缓存编译产物，加速跨运行增量构建
        sudo apt-get install -y ninja-build p7zip-full libc++-dev libc++abi-dev ccache

    # ========== Linux: 缓存 Vulkan SDK（避免每次下载 300MB+ tar 包）==========
    - name: Cache Vulkan SDK (Linux)
      id: cache-vulkan-linux
      if: runner.os == 'Linux'
      uses: actions/cache@v4
      with:
        path: ${{ runner.tool_cache }}/vulkan-sdk
        key: vulkan-sdk-linux-1.4.357.0

    # 命中缓存：直接复用已解压的 SDK，仅设置环境变量
    - name: Setup Vulkan SDK env (Linux, cached)
      if: runner.os == 'Linux' && steps.cache-vulkan-linux.outputs.cache-hit == 'true'
      run: |
        SDK_DIR="${{ runner.tool_cache }}/vulkan-sdk"
        echo "VULKAN_SDK=$SDK_DIR" >> "$GITHUB_ENV"
        echo "$SDK_DIR/bin" >> "$GITHUB_PATH"
        "$SDK_DIR/bin/glslc" --version

    # 未命中：下载官方 tar 包并解压到固定缓存目录（保证后续路径稳定）
    - name: Install Vulkan SDK (Linux)
      if: runner.os == 'Linux' && steps.cache-vulkan-linux.outputs.cache-hit != 'true'
      run: |
        # Ubuntu 26.04 (resolute) 的 LunarG apt 仓库不存在（404），改用官方 tar.xz。
        # 解压后为 1.x.yy.z/x86_64，内含 bin(含 glslc)/include/lib。
        # 注：Linux 无 "latest" 下载端点（404），固定用官方版本号 URL（LunarG 保留旧版本）。
        cd "$HOME"
        curl -L --fail --retry 5 --retry-delay 5 --retry-all-errors \
          -o vulkansdk.tar.xz \
          "https://sdk.lunarg.com/sdk/download/1.4.357.0/linux/vulkansdk-linux-x86_64-1.4.357.0.tar.xz"
        tar xf vulkansdk.tar.xz
        SDK_SRC="$(ls -d "$HOME"/1.*/x86_64 2>/dev/null | head -n1)"
        if [ -z "$SDK_SRC" ]; then echo "SDK extract dir not found"; exit 1; fi
        # 拷到固定缓存目录，保证命中后 VULKAN_SDK 路径稳定
        SDK_DIR="${{ runner.tool_cache }}/vulkan-sdk"
        mkdir -p "$SDK_DIR"
        cp -a "$SDK_SRC/." "$SDK_DIR/"
        # 供后续步骤使用：find_package(Vulkan) 读 VULKAN_SDK，PATH 找到 glslc
        echo "VULKAN_SDK=$SDK_DIR" >> "$GITHUB_ENV"
        echo "$SDK_DIR/bin" >> "$GITHUB_PATH"
        "$SDK_DIR/bin/glslc" --version

    # ========== Windows: 安装 LLVM Clang + Ninja ==========
    - name: Install Clang & Ninja (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        choco install llvm --yes --no-progress
        choco install ninja --yes --no-progress
        choco install 7zip --yes --no-progress
        # ccache：缓存编译产物，加速跨运行增量构建
        choco install ccache --yes --no-progress
        # 将 LLVM 的 bin 目录加入 PATH
        $llvmPath = "C:\Program Files\LLVM\bin"
        echo "$llvmPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    # ========== Windows: 缓存 Vulkan SDK（避免重复下载安装） ==========
    - name: Cache Vulkan SDK (Windows)
      id: cache-vulkan-windows
      if: runner.os == 'Windows'
      uses: actions/cache@v4
      with:
        path: C:\VulkanSDK
        key: vulkan-sdk-windows-latest

    # 命中缓存：直接复用已安装的 SDK，仅设置环境变量
    - name: Setup Vulkan SDK env (Windows, cached)
      if: runner.os == 'Windows' && steps.cache-vulkan-windows.outputs.cache-hit == 'true'
      shell: pwsh
      run: |
        $sdkDir = Get-ChildItem "C:\VulkanSDK" -Directory -ErrorAction SilentlyContinue |
                  Sort-Object Name -Descending | Select-Object -First 1
        if (-not $sdkDir) { throw "Vulkan SDK cache empty under C:\VulkanSDK" }
        "VULKAN_SDK=$($sdkDir.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "$($sdkDir.FullName)\Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    # 未命中：LunarG 官方无人值守安装
    - name: Install Vulkan SDK (Windows)
      if: runner.os == 'Windows' && steps.cache-vulkan-windows.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        $exe = "$env:TEMP\vulkan_sdk.exe"
        # 用 curl.exe 下载（Invoke-WebRequest 对大文件易超时被取消），带重试；
        # --fail 让 HTTP 错误码直接失败，避免写入错误页
        curl.exe -L --fail --retry 5 --retry-delay 5 --retry-all-errors -o $exe "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan_sdk.exe"
        if (-not (Test-Path $exe)) { throw "Vulkan SDK download failed" }
        # 官方无人值守安装（新版安装器废弃了旧的 /S 参数）
        Start-Process -FilePath $exe -ArgumentList "--accept-licenses","--default-answer","--confirm-command","install" -Wait
        # 定位已安装的 Vulkan SDK 目录（安装器把 VULKAN_SDK 设为 C:\VulkanSDK\<version>，
        # 但当前进程看不到更新的环境变量，需显式写出供后续步骤使用）
        $sdkDir = Get-ChildItem "C:\VulkanSDK" -Directory -ErrorAction SilentlyContinue |
                  Sort-Object Name -Descending | Select-Object -First 1
        if (-not $sdkDir) { throw "Vulkan SDK not found under C:\VulkanSDK" }
        # 设置 VULKAN_SDK 供 find_package(Vulkan) 使用，并将 Bin 加入 PATH（含 glslc）
        "VULKAN_SDK=$($sdkDir.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "$($sdkDir.FullName)\Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    # ========== CMake 配置（分平台，因为 bash/pwsh 换行语法不同）==========
    - name: Configure CMake (Linux)
      if: runner.os == 'Linux'
      run: |
        cmake -B ${{github.workspace}}/build \
          -G Ninja \
          -DCMAKE_CXX_COMPILER=clang++ \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
          -DCMAKE_CXX_STANDARD=26 \
          -DCMAKE_CXX_STANDARD_REQUIRED=ON \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DNN_ENABLE_NATIVE=OFF \
          -DCMAKE_CXX_FLAGS="-stdlib=libc++" \
          -DCMAKE_EXE_LINKER_FLAGS="-stdlib=libc++"
      env:
        CC: clang
        CXX: clang++

    - name: Configure CMake (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        cmake -B ${{github.workspace}}/build `
          -G Ninja `
          -DCMAKE_CXX_COMPILER=clang++ `
          -DCMAKE_C_COMPILER=clang `
          -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} `
          -DCMAKE_CXX_STANDARD=26 `
          -DCMAKE_CXX_STANDARD_REQUIRED=ON `
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache `
          -DCMAKE_C_COMPILER_LAUNCHER=ccache `
          -DNN_ENABLE_NATIVE=OFF
      env:
        CC: clang
        CXX: clang++

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    # 将编译产物打包为 7z
    - name: Package binaries (Linux)
      if: runner.os == 'Linux'
      run: |
        7z a ${{github.workspace}}/build/${{ matrix.archive-name }} \
          ${{github.workspace}}/build/mnist_train \
          ${{github.workspace}}/build/mnist_infer \
          ${{github.workspace}}/build/text_train \
          ${{github.workspace}}/build/text_infer \
          ${{github.workspace}}/build/tokenizer_train \
          ${{github.workspace}}/build/tokenizer_infer

    - name: Package binaries (Windows)
      if: runner.os == 'Windows'
      run: |
        7z a ${{github.workspace}}/build/${{ matrix.archive-name }} `
          ${{github.workspace}}/build/mnist_train.exe `
          ${{github.workspace}}/build/mnist_infer.exe `
          ${{github.workspace}}/build/text_train.exe `
          ${{github.workspace}}/build/text_infer.exe `
          ${{github.workspace}}/build/tokenizer_train.exe `
          ${{github.workspace}}/build/tokenizer_infer.exe

    # 将 7z 包上传为 artifact，供 release job 使用
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact-name }}
        path: ${{github.workspace}}/build/${{ matrix.archive-name }}
        retention-days: 1

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download Linux artifacts
      uses: actions/download-artifact@v4
      with:
        name: linux-binaries
        path: artifacts/linux

    - name: Download Windows artifacts
      uses: actions/download-artifact@v4
      with:
        name: windows-binaries
        path: artifacts/windows

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        name: Nightly Build - ${{ github.sha }}
        tag_name: nightly
        prerelease: true
        body: |
          自动构建版本，commit: ${{ github.sha }}

          ### 构建环境
          - Compiler: Clang (Latest)
          - C++ Standard: C++26

          | 平台 | 产物 |
          |------|------|
          | 🐧 Linux (Ubuntu Latest) | `neuralnet-linux-x64.7z` |
          | 🪟 Windows (Latest) | `neuralnet-windows-x64.7z` |
        files: |
          artifacts/**/*.7z
