# .github/workflows/cmake-clang-latest.yml
name: CMake on Linux (Clang Latest, C++26)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # 使用 LLVM 官方脚本安装最新的 Clang
    # 该脚本会自动添加仓库并安装最新稳定版 Clang，例如 clang-21 或更高版本
    - name: Install latest Clang
      run: |
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh all
        # 创建符号链接，确保 clang/clang++ 命令指向新安装的版本
        sudo ln -sf $(ls /usr/bin/clang-[0-9]* | sort -V | tail -n1) /usr/bin/clang
        sudo ln -sf $(ls /usr/bin/clang++-[0-9]* | sort -V | tail -n1) /usr/bin/clang++

    - name: Configure CMake
      # 使用 Ninja 生成器，并显式指定编译器
      run: |
        cmake -B ${{github.workspace}}/build \
          -G Ninja \
          -DCMAKE_CXX_COMPILER=clang++ \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
          -DCMAKE_CXX_STANDARD=26 \
          -DCMAKE_CXX_STANDARD_REQUIRED=ON
      env:
        CC: clang
        CXX: clang++

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Test
      working-directory: ${{github.workspace}}/build
      run: ctest -C ${{env.BUILD_TYPE}}

    # 将编译产物打包为 artifact，供 release job 使用
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: linux-binaries
        path: |
          ${{github.workspace}}/build/mnist_train
          ${{github.workspace}}/build/mnist_infer
        retention-days: 1

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: linux-binaries

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        name: Nightly Build - ${{ github.sha }}
        tag_name: nightly
        prerelease: true
        body: |
          自动构建版本，commit: ${{ github.sha }}

          ### 构建环境
          - OS: Ubuntu Latest
          - Compiler: Clang (Latest)
          - C++ Standard: C++26
        files: |
          mnist_train
          mnist_infer
