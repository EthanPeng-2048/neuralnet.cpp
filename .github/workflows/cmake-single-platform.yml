# .github/workflows/cmake-clang-latest.yml
name: CMake (Clang Latest, C++26)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  BUILD_TYPE: Release

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            artifact-name: linux-binaries
            binary-suffix: ""
            archive-name: neuralnet-linux-x64.7z
          - os: windows-latest
            artifact-name: windows-binaries
            binary-suffix: ".exe"
            archive-name: neuralnet-windows-x64.7z

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    # ========== Linux: 安装 LLVM Clang + Ninja ==========
    - name: Install Clang & Ninja (Linux)
      if: runner.os == 'Linux'
      run: |
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh all
        sudo ln -sf $(ls /usr/bin/clang-[0-9]* | sort -V | tail -n1) /usr/bin/clang
        sudo ln -sf $(ls /usr/bin/clang++-[0-9]* | sort -V | tail -n1) /usr/bin/clang++
        sudo apt-get install -y ninja-build p7zip-full

    # ========== Windows: 安装 LLVM Clang + Ninja ==========
    - name: Install Clang & Ninja (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        choco install llvm --yes --no-progress
        choco install ninja --yes --no-progress
        choco install 7zip --yes --no-progress
        # 将 LLVM 的 bin 目录加入 PATH
        $llvmPath = "C:\Program Files\LLVM\bin"
        echo "$llvmPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    # ========== CMake 配置（分平台，因为 bash/pwsh 换行语法不同）==========
    - name: Configure CMake (Linux)
      if: runner.os == 'Linux'
      run: |
        cmake -B ${{github.workspace}}/build \
          -G Ninja \
          -DCMAKE_CXX_COMPILER=clang++ \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
          -DCMAKE_CXX_STANDARD=26 \
          -DCMAKE_CXX_STANDARD_REQUIRED=ON
      env:
        CC: clang
        CXX: clang++

    - name: Configure CMake (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        cmake -B ${{github.workspace}}/build `
          -G Ninja `
          -DCMAKE_CXX_COMPILER=clang++ `
          -DCMAKE_C_COMPILER=clang `
          -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} `
          -DCMAKE_CXX_STANDARD=26 `
          -DCMAKE_CXX_STANDARD_REQUIRED=ON
      env:
        CC: clang
        CXX: clang++

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Test
      working-directory: ${{github.workspace}}/build
      run: ctest -C ${{env.BUILD_TYPE}}

    # 将编译产物打包为 7z
    - name: Package binaries (Linux)
      if: runner.os == 'Linux'
      run: |
        7z a ${{github.workspace}}/build/${{ matrix.archive-name }} \
          ${{github.workspace}}/build/mnist_train \
          ${{github.workspace}}/build/mnist_infer

    - name: Package binaries (Windows)
      if: runner.os == 'Windows'
      run: |
        7z a ${{github.workspace}}/build/${{ matrix.archive-name }} `
          ${{github.workspace}}/build/mnist_train.exe `
          ${{github.workspace}}/build/mnist_infer.exe

    # 将 7z 包上传为 artifact，供 release job 使用
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact-name }}
        path: ${{github.workspace}}/build/${{ matrix.archive-name }}
        retention-days: 1

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download Linux artifacts
      uses: actions/download-artifact@v4
      with:
        name: linux-binaries
        path: artifacts/linux

    - name: Download Windows artifacts
      uses: actions/download-artifact@v4
      with:
        name: windows-binaries
        path: artifacts/windows

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        name: Nightly Build - ${{ github.sha }}
        tag_name: nightly
        prerelease: true
        body: |
          自动构建版本，commit: ${{ github.sha }}

          ### 构建环境
          - Compiler: Clang (Latest)
          - C++ Standard: C++26

          | 平台 | 产物 |
          |------|------|
          | 🐧 Linux (Ubuntu Latest) | `neuralnet-linux-x64.7z` |
          | 🪟 Windows (Latest) | `neuralnet-windows-x64.7z` |
        files: |
          artifacts/**/*.7z
